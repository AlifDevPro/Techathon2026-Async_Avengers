services:
  office-energy-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    image: alifahmaddev/office-energy-monitor:latest
    container_name: office-energy-monitor
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      API_BASE_URL: http://127.0.0.1:3000
      HOSTNAME: 0.0.0.0
      PORT: 3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/devices"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
